<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Carousel (No Bootstrap)</title>
  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      margin: 0;
      padding: 0;
      background: #e2eaef;
    }

    h2 {
      text-align: center;
      font-size: 26px;
      margin: 40px 0 20px;
      position: relative;
    }

    h2::after {
      content: "";
      width: 100px;
      height: 4px;
      background: #7ac400;
      display: block;
      margin: 10px auto 0;
      border-radius: 2px;
    }

    .carousel-container {
      max-width: 1200px;
      margin: auto;
      padding: 0 20px;
      position: relative;
    }

    .carousel-track {
      display: flex;
      overflow-x: auto;
      scroll-behavior: smooth;
      gap: 20px;
      padding-bottom: 20px;
    }

    .carousel-track::-webkit-scrollbar {
      display: none;
    }

    .card {
      background: #fff;
      flex: 0 0 250px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 16px;
      position: relative;
    }

    .img-box {
      height: 150px;
      text-align: center;
      margin-bottom: 10px;
    }

    .img-box img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    .card h4 {
      margin: 10px 0 5px;
    }

    .price {
      font-size: 14px;
      margin-bottom: 10px;
    }

    .price strike {
      color: #888;
      margin-right: 5px;
    }

    .stars {
      color: #ffc000;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .btn {
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid #7ac400;
      color: #7ac400;
      text-transform: uppercase;
      font-size: 12px;
      border-radius: 20px;
      text-decoration: none;
      transition: 0.3s ease;
    }

    .btn:hover {
      background: #7ac400;
      color: white;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: #7ac400;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      font-size: 18px;
      z-index: 1;
      border-radius: 50%;
    }

    .arrow.left {
      left: -20px;
    }

    .arrow.right {
      right: -20px;
    }

    @media (max-width: 768px) {
      .card {
        flex: 0 0 70%;
      }

      .arrow {
        display: none;
      }
    }
  </style>
</head>
<body>

  <h2>Featured <b>Products</b></h2>
  <div class="carousel-container">
    <button class="arrow left" onclick="scrollCarousel(-1)">❮</button>
    <div class="carousel-track" id="carousel">
      <div class="card">
        <div class="img-box">
          <img src="https://via.placeholder.com/150?text=iPad" alt="iPad">
        </div>
        <h4>Apple iPad</h4>
        <div class="stars">★★★★☆</div>
        <p class="price"><strike>$400.00</strike> <b>$369.00</b></p>
        <a href="#" class="btn">Add to Cart</a>
      </div>
      <div class="card">
        <div class="img-box">
          <img src="https://via.placeholder.com/150?text=Headphones" alt="Headphones">
        </div>
        <h4>Sony Headphones</h4>
        <div class="stars">★★★★☆</div>
        <p class="price"><strike>$25.00</strike> <b>$23.99</b></p>
        <a href="#" class="btn">Add to Cart</a>
      </div>
      <div class="card">
        <div class="img-box">
          <img src="https://via.placeholder.com/150?text=MacBook+Air" alt="MacBook">
        </div>
        <h4>Macbook Air</h4>
        <div class="stars">★★★★½</div>
        <p class="price"><strike>$899.00</strike> <b>$649.00</b></p>
        <a href="#" class="btn">Add to Cart</a>
      </div>
      <div class="card">
        <div class="img-box">
          <img src="https://via.placeholder.com/150?text=Nikon" alt="Nikon DSLR">
        </div>
        <h4>Nikon DSLR</h4>
        <div class="stars">★★★☆☆</div>
        <p class="price"><strike>$315.00</strike> <b>$250.00</b></p>
        <a href="#" class="btn">Add to Cart</a>
      </div>
      <div class="card">
        <div class="img-box">
          <img src="https://via.placeholder.com/150?text=iPhone" alt="iPhone">
        </div>
        <h4>iPhone</h4>
        <div class="stars">★★★★☆</div>
        <p class="price"><strike>$599.00</strike> <b>$549.00</b></p>
        <a href="#" class="btn">Add to Cart</a>
      </div>
    </div>
    <button class="arrow right" onclick="scrollCarousel(1)">❯</button>
  </div>

  <script>
    function scrollCarousel(direction) {
      const carousel = document.getElementById('carousel');
      const cardWidth = carousel.querySelector('.card').offsetWidth + 20; // include margin
      carousel.scrollBy({ left: cardWidth * direction, behavior: 'smooth' });
    }
  </script>

</body>
</html>
